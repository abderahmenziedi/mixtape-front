<section class="vh-100 d-flex align-items-center justify-content-center register-bg">

    <div class="card shadow-lg p-4 register-card">
        
      <h3 class="text-center mb-4 text-light fw-bold">Se connecter</h3>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  
        <div class="mb-3">
          <label for="email" class="form-label text-light">Adresse email</label>
          <input id="email" type="email" formControlName="email" class="form-control register-input" placeholder="exemple@gmail.com">
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger small">
            Email invalide
          </div>
        </div>
  
        <div class="mb-3">
          <label for="password" class="form-label text-light">Mot de passe</label>
          <input id="password" type="password" formControlName="password" class="form-control register-input" placeholder="********">
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small">
            Mot de passe obligatoire
          </div>
        </div>

        <div class="mb-2 text-end">
            <a routerLink="/register" class="text-decoration-none text-info small fw-bold">
              Créer un compte
            </a>
          </div>

       
  
        <div class="text-center mt-4">
          <button type="submit" class="btn register-btn w-100" [disabled]="loading">
            {{ loading ? 'Connexion...' : 'Se connecter' }}
          </button>
        </div>
  
        <div *ngIf="successMessage" class="alert alert-success mt-3 text-center">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert alert-danger mt-3 text-center">{{ errorMessage }}</div>
      </form>
    </div>
  </section>
